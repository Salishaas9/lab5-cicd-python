stages:
  - install
  - lint
  - security
  - test
  - build

variables:
  PYTHON_VERSION: "3.15"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

install_dependencies:
  stage: install
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install -r requirements.txt
  artifacts:
    paths:
      - .cache/pip

lint_code:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install flake8
  script:
    - flake8 app.py tests/ --max-line-length=120

security_analysis:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install bandit
  script:
    - bandit -r app.py tests/

check_vulnerabilities:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install safety
  script:
    - pip install -r requirements.txt
    - safety check

run_tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install -r requirements.txt
    - pip install pytest
  script:
    - pytest tests/ -v

build_project:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install -r requirements.txt
    - python -m py_compile app.py
  artifacts:
    paths:
      - app.py
    expire_in: 1 week
